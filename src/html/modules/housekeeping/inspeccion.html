<div class="stack-md">
  <div class="alert alert-info">
    <span data-ref="info-icon"></span>
    <span><strong>Flujo B:</strong> Solo al aprobar la inspección, la habitación pasa a estado "Inspeccionada" y queda habilitada para Check-in en Recepción (M01).</span>
  </div>
  <div data-ref="pending-slot"></div>
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Historial de Inspecciones</h2>
    </div>
    <div class="divide-list" data-ref="history-list"></div>
  </div>
</div>

<template data-tpl="card-inspeccion">
  <div class="card card-pad stack-md">
    <div class="row-between">
      <div>
        <h3 class="text-base font-bold text-navy" data-ref="title"></h3>
        <div class="text-11 text-slate-500">Lista para control de calidad</div>
      </div>
      <div data-ref="badge"></div>
    </div>
    <div class="stack-xs">
      <label class="checkbox-row">
        <input type="checkbox" checked data-check="tendidoCama" />
        <span>Tendido de cama y lencería impecable</span>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" checked data-check="banoDesinfectado" />
        <span>Baño desinfectado y grifería sin sarro</span>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" checked data-check="amenitiesReposicion" />
        <span>Amenities completos y toallas selladas</span>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" checked data-check="minibarVerificado" />
        <span>Minibar y equipos eléctricos verificados</span>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" checked data-check="sinDanosVisibles" />
        <span>Sin daños ni incidencias visibles</span>
      </label>
    </div>
    <div class="row-wrap justify-end hidden" data-ref="actions">
      <button type="button" class="btn btn-danger-outline btn-sm" data-ref="reject-btn">Rechazar (Devolver)</button>
      <button type="button" class="btn btn-teal btn-sm" data-ref="approve-btn">
        <span data-ref="check-icon"></span>
        <span>Aprobar Inspección</span>
      </button>
    </div>
  </div>
</template>

<template data-tpl="fila-historial-inspeccion">
  <div class="p-4 row-between">
    <div>
      <div class="text-xs font-semibold text-navy" data-ref="title"></div>
      <div class="text-11 text-slate-500" data-ref="obs"></div>
    </div>
    <div data-ref="result"></div>
  </div>
</template>
