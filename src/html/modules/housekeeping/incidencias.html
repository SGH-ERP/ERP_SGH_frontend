<div class="card">
  <div class="card-header">
    <div>
      <h2 class="card-title">Incidencias Técnicas e Infraestructura</h2>
      <p class="card-subtitle">Incluye incidencias escaladas automáticamente desde Reclamos CRM (Flujo E)</p>
    </div>
    <button type="button" class="btn btn-primary btn-sm hidden" data-ref="new-btn">
      <span data-ref="plus-icon"></span>
      <span>Nueva incidencia</span>
    </button>
  </div>
  <div class="table-scroll">
    <table class="erp-table">
      <thead>
        <tr>
          <th>Código</th>
          <th>Ubicación / Descripción</th>
          <th>Prioridad</th>
          <th>Estado</th>
          <th class="text-right">Orden de Trabajo</th>
        </tr>
      </thead>
      <tbody data-ref="tbody"></tbody>
    </table>
  </div>
</div>

<template data-tpl="fila-incidencia">
  <tr>
    <td class="font-mono font-semibold text-navy">
      <span data-ref="code"></span>
      <div class="text-2xs text-teal hidden" data-ref="flow-e">Flujo E (CRM)</div>
    </td>
    <td>
      <div class="font-medium text-navy" data-ref="location"></div>
      <div class="text-11 text-slate-500" data-ref="desc"></div>
    </td>
    <td data-ref="priority"></td>
    <td data-ref="status"></td>
    <td class="text-right" data-ref="action"></td>
  </tr>
</template>
