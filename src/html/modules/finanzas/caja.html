<div class="stack-md"></div>

<template data-tpl="vista-caja-cerrada">
  <div class="card card-pad row-between">
    <div>
      <h2 class="card-title">No hay turno de caja abierto</h2>
      <p class="card-subtitle">Abre un turno con fondo inicial para operar cobros y movimientos de caja.</p>
    </div>
    <button type="button" class="btn btn-teal hidden" data-ref="open-shift-btn">Abrir Caja (S/ 1,500)</button>
  </div>
</template>

<template data-tpl="vista-caja-abierta">
  <div class="stack-md">
    <div class="grid-kpis" data-ref="kpis"></div>

    <div class="grid-2-lg hidden" data-ref="controls-grid">
      <div class="card card-pad stack-sm">
        <h3 class="card-title">Registrar Movimiento Manual en Caja</h3>
        <div class="grid-2">
          <select class="select-control text-xs" data-ref="move-type">
            <option value="Ingreso">Ingreso</option>
            <option value="Egreso">Egreso</option>
          </select>
          <select class="select-control text-xs" data-ref="move-method">
            <option value="Efectivo">Efectivo</option>
            <option value="Yape / Plin">Yape / Plin</option>
            <option value="Transferencia">Transferencia</option>
          </select>
        </div>
        <div class="grid-2">
          <input class="input-control" placeholder="Concepto..." data-ref="move-concept" />
          <input type="number" step="0.5" min="1" class="input-control font-mono" placeholder="Monto S/" data-ref="move-amount" />
        </div>
        <button type="button" class="btn btn-primary btn-sm" data-ref="add-move-btn">Registrar en turno</button>
      </div>

      <div class="card card-pad stack-sm">
        <h3 class="card-title">Arqueo y Cierre de Turno</h3>
        <input type="number" step="0.5" class="input-control font-mono" data-ref="close-counted" />
        <button type="button" class="btn btn-danger-outline btn-sm" data-ref="close-shift-btn">Cerrar turno de caja</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3 class="card-title" data-ref="movements-title"></h3>
      </div>
      <div class="divide-list" data-ref="movements-list"></div>
    </div>
  </div>
</template>

<template data-tpl="fila-movimiento-caja">
  <div class="p-3 row-between text-xs">
    <div>
      <strong class="text-navy" data-ref="title"></strong>
      <div class="text-11 text-slate-500" data-ref="meta"></div>
    </div>
    <span class="font-mono font-bold" data-ref="amount"></span>
  </div>
</template>
