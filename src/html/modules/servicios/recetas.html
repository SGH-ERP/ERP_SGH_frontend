<div class="card">
  <div class="card-header">
    <div>
      <h2 class="card-title">Escandallos, Recetas y Costeo</h2>
      <p class="card-subtitle">Control de costo de alimentos y bebidas por plato/bebida vendido en POS</p>
    </div>
    <button type="button" class="btn btn-primary btn-sm hidden" data-ref="new-btn">
      <span data-ref="new-icon"></span>
      <span>Configurar receta</span>
    </button>
  </div>
  <div class="divide-list" data-ref="recipes-list"></div>
</div>

<template data-tpl="fila-receta">
  <div class="p-4 row-between items-start">
    <div>
      <div class="text-sm font-bold text-navy" data-ref="name"></div>
      <div class="text-11 text-slate-500 mt-1" data-ref="ingredients"></div>
    </div>
    <div class="text-right font-mono">
      <div class="text-xs text-slate-600" data-ref="price-cost"></div>
      <div class="text-xs font-bold text-teal" data-ref="margin"></div>
    </div>
  </div>
</template>
