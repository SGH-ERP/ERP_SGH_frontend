<div class="split-layout-3">
  <div class="card card-pad stack-sm">
    <div data-ref="search-slot"></div>
    <div class="divide-list" data-ref="guests-list"></div>
  </div>
  <div data-ref="detail-slot"></div>
</div>

<template data-tpl="item-huesped-lista">
  <button type="button" class="w-full p-3" style="width: 100%; text-align: left; cursor: pointer;">
    <div class="row-between">
      <span class="font-semibold text-xs text-navy" data-ref="name"></span>
      <span class="font-mono text-11 text-teal font-semibold" data-ref="tier"></span>
    </div>
    <div class="text-11 text-slate-500 mt-0.5" data-ref="meta"></div>
  </button>
</template>

<template data-tpl="detalle-huesped-360">
  <div class="card card-pad stack-md">
    <div class="row-between border-b pb-3">
      <div>
        <div class="text-xs font-semibold text-teal" data-ref="segment-tier"></div>
        <h2 class="text-lg font-bold text-navy" data-ref="full-name"></h2>
        <div class="text-11 text-slate-500 font-mono mt-0.5" data-ref="contact-pii"></div>
      </div>
      <div data-ref="consent-status"></div>
    </div>

    <div class="grid-3" data-ref="kpis"></div>

    <div class="p-3 bg-subtle rounded-md text-xs text-slate-700">
      <strong class="text-navy">Preferencias: </strong>
      <span data-ref="preferences"></span>
      <div class="mt-1 text-11 text-slate-500 hidden" data-ref="notes"></div>
    </div>

    <div class="grid-2">
      <div>
        <h3 class="text-xs font-bold text-navy mb-2" data-ref="res-title"></h3>
        <div class="divide-list border rounded-md" data-ref="res-list"></div>
      </div>
      <div>
        <h3 class="text-xs font-bold text-navy mb-2" data-ref="folio-title"></h3>
        <div class="divide-list border rounded-md" data-ref="folio-list"></div>
      </div>
    </div>
  </div>
</template>

<template data-tpl="item-huesped-reserva">
  <div class="p-2.5 row-between text-xs">
    <span class="font-mono font-semibold text-navy" data-ref="code"></span>
    <div data-ref="status"></div>
  </div>
</template>

<template data-tpl="item-huesped-folio">
  <div class="p-2.5 row-between text-xs">
    <span class="font-mono font-semibold text-navy" data-ref="code"></span>
    <span class="font-mono" data-ref="total"></span>
  </div>
</template>
