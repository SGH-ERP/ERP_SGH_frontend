<div class="stack-md">
  <div class="card card-pad stack-md">
    <div class="row-between">
      <div class="row-gap-sm">
        <span data-ref="db-icon"></span>
        <div>
          <h2 class="card-title" data-ref="persistence-label"></h2>
          <p class="card-subtitle" data-ref="persistence-desc"></p>
        </div>
      </div>
      <div data-ref="persistence-status"></div>
    </div>

    <div class="pt-3 border-t-soft row-between hidden" data-ref="reset-row">
      <div>
        <div class="text-xs font-semibold text-navy">Restaurar datos operativos iniciales</div>
        <div class="text-11 text-slate-500">Restaura reservas, folios, inventario e incidencias al estado inicial del sistema.</div>
      </div>
      <button type="button" class="btn btn-danger-outline" data-ref="reset-btn">
        <span data-ref="reset-icon"></span>
        <span>Restaurar datos iniciales</span>
      </button>
      <div class="row-gap-sm hidden" data-ref="confirm-group">
        <button type="button" class="btn btn-danger" data-ref="confirm-reset-btn">Confirmar reinicio</button>
        <button type="button" class="btn btn-outline" data-ref="cancel-reset-btn">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div>
        <h2 class="card-title">Esquema PostgreSQL & RLS para Supabase</h2>
        <p class="card-subtitle">Script SQL de referencia con políticas de seguridad por fila para los 16 perfiles RBAC.</p>
      </div>
      <button type="button" class="btn btn-outline btn-sm" data-ref="copy-sql-btn">
        <span data-ref="copy-icon"></span>
        <span data-ref="copy-label">Copiar SQL</span>
      </button>
    </div>
    <pre class="code-pre" data-ref="sql-pre"></pre>
  </div>
</div>
